name: Tests

on:
  push:
    branches: ["main"]

  pull_request:
    branches: ["main"]

defaults:
  run:
    working-directory: data-engineer/05-s3-parquet-duckdb-pipeline

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest